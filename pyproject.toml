[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refworld-bench"
version = "0.0.1"
description = "Benchmark utilities for reference-anchored persistent world synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy==1.26.1"]

[project.optional-dependencies]
camera = ["opencv-python-headless==4.10.0.84"]
method = ["Pillow>=10", "opencv-python-headless==4.10.0.84"]
validation = ["jsonschema>=4.23"]
dataset = ["requests>=2.32,<3"]
dev = ["pytest>=8", "jsonschema>=4.23", "opencv-python-headless==4.10.0.84", "Pillow>=10"]
repaint-sd2 = [
  "diffusers==0.30.3",
  "transformers==4.44.2",
  "accelerate==0.34.2",
  "huggingface_hub==0.34.6",
  "scipy==1.14.1",
]

[project.scripts]
refworld-validate-report = "refworld.cli:validate_report_main"
refworld-prepare-blendedmvs = "refworld.cli:prepare_blendedmvs_main"
refworld-worldgen-run = "refworld.runners.worldgen_generate:main"
refworld-vggt-prefetch = "refworld.runners.prefetch_vggt:main"
refworld-vggt-source = "refworld.runners.vggt_source:main"
refworld-vggt-oracle-scale-pair = "refworld.runners.blendedmvs_vggt_scaled_pair:main"
refworld-source-splat = "refworld.runners.source_splat:main"
refworld-warp-only = "refworld.runners.warp_only:main"
refworld-worldforge-ref = "refworld.runners.worldforge_ref:main"
refworld-sd2-inpaint-candidate = "refworld.runners.sd2_inpaint_candidate:main"
refworld-compose-candidate = "refworld.runners.compose_candidate:main"
refworld-score-anchor = "refworld.runners.score_anchor:main"
refworld-marble-stage1 = "refworld.cli:marble_stage1_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
