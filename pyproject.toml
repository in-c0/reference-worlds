[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refworld-bench"
version = "0.0.1"
description = "Benchmark utilities for reference-anchored persistent world synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.10"]
method = ["Pillow>=10", "opencv-python-headless>=4.10"]
validation = ["jsonschema>=4.23"]
dev = ["pytest>=8", "jsonschema>=4.23", "opencv-python-headless>=4.10", "Pillow>=10"]

[project.scripts]
refworld-validate-report = "refworld.cli:validate_report_main"
refworld-prepare-blendedmvs = "refworld.cli:prepare_blendedmvs_main"
refworld-worldgen-run = "refworld.runners.worldgen_generate:main"
refworld-vggt-source = "refworld.runners.vggt_source:main"
refworld-source-splat = "refworld.runners.source_splat:main"
refworld-warp-only = "refworld.runners.warp_only:main"
refworld-compose-candidate = "refworld.runners.compose_candidate:main"
refworld-marble-stage1 = "refworld.cli:marble_stage1_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
